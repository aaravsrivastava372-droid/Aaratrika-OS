function overlap(a,b){
 return a.x<b.x+b.w&&a.x+a.w>b.x&&
        a.y<b.y+b.h&&a.y+a.h>b.y;
}

function hurt(){
 if(invincible>0||gameState!=="playing")return;
 lives--;

  gameState="gameover";
  return;
 }
 player.x=area==="forest"?checkpoint:area==="cave"?130:100;
 player.y=360;
 player.vx=0;

function drawRect(x,y,w,h,color){
 ctx.fillStyle=color;
 ctx.fillRect(Math.floor(x),Math.floor(y),w,h);
}

function drawBackground(){
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#17142e");
 g.addColorStop(1,"#37304a");
 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);

 ctx.fillStyle="#d9d1f0";
 ctx.beginPath();ctx.arc(790,100,48,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#17142e";
 ctx.beginPath();ctx.arc(810,82,43,0,Math.PI*2);ctx.fill();

 for(let i=0;i<55;i++){
  let x=(i*173-camera*.15)%W;
  if(x<0)x+=W;
  ctx.fillStyle=i%3===0?"#d9c9ff":"#827ba5";
  ctx.fillRect(x,(i*67)%220,3,3);
 }

 ctx.fillStyle="#27243c";
 for(let i=0;i<8;i++){
  const x=i*180-(camera*.25)%180;
  ctx.beginPath();ctx.arc(x,410,120,Math.PI,0);ctx.fill();
 }

 for(let i=0;i<16;i++){
  const x=i*150-(camera*.45)%150;
  drawTree(x,415,.8+(i%3)*.15);
 }

 // Fireflies
 for(let i=0;i<20;i++){
  const x=(i*97+frame*.45)%W;
  const y=240+(i*43)%170+Math.sin(frame*.04+i)*8;
  ctx.fillStyle=i%2?"#b8e99a":"#d8b8ff";
  ctx.globalAlpha=.45+Math.sin(frame*.06+i)*.3;
  ctx.fillRect(x,y,3,3);
 }
 ctx.globalAlpha=1;

 // Fog
 ctx.fillStyle="rgba(160,150,190,.035)";
 for(let i=0;i<5;i++){
  ctx.fillRect((i*230+frame*.25)%W,420,160,20);
 }
}

function drawTree(x,y,s){
 ctx.save();
 ctx.translate(x,y);
 ctx.scale(s,s);
 drawRect(-9,-105,18,110,"#211b30");
 drawRect(-9,-80,-38,9,"#211b30");
 drawRect(0,-65,42,9,"#211b30");
 drawRect(-35,-95,8,30,"#211b30");
 drawRect(30,-88,8,32,"#211b30");
 drawRect(-42,-108,18,18,"#362847");
 drawRect(25,-112,20,20,"#362847");
 drawRect(-10,-130,20,25,"#362847");
 ctx.restore();
}

 ctx.fillRect(0,0,W,H);

 ctx.fillRect(0,0,W,75);

 for(let i=0;i<20;i++){
  ctx.fillStyle="#30203d";
  ctx.beginPath();
  ctx.moveTo(i*53,0);
  ctx.lineTo(i*53+15,65+(i%3)*15);
  ctx.lineTo(i*53+30,0);

function drawPlatforms(list,cam){
 for(const p of list){
  const x=Math.floor(p.x-cam);
  if(x+p.w<0||x>W)continue;
  drawRect(x,p.y,p.w,p.h,"#352b40");
  drawRect(x,p.y,p.w,9,"#58714c");
  for(let i=0;i<p.w;i+=26)drawRect(x+i,p.y-3,10,4,"#8da66a");
  for(let i=10;i<p.w;i+=38)drawRect(x+i,p.y+22,15,5,"#292035");
 }
}

function drawMessage(){
 if(messageTimer<=0)return;
 messageTimer--;

 ctx.save();
 ctx.globalAlpha=Math.min(1,messageTimer/25);
 ctx.fillStyle="rgba(12,8,25,.94)";
 ctx.fillRect(145,375,670,105);
 ctx.strokeStyle="#c7a5ff";
 ctx.lineWidth=2;
 ctx.strokeRect(145,375,670,105);
 ctx.textAlign="center";
 ctx.fillStyle="#a58bc8";
 ctx.font="12px monospace";
 ctx.fillText("✦ A MESSAGE FROM THE HOLLOW ✦",480,401);
 ctx.fillStyle="#f0e4ff";
 ctx.font="bold 17px monospace";

 let words=activeMessage.split(" "),lines=[],line="";
 for(const word of words){
  const test=line?line+" "+word:word;
  if(ctx.measureText(test).width>590){
   lines.push(line);line=word;
  }else line=test;
 }
 if(line)lines.push(line);
 const start=432-(lines.length-1)*11;
 lines.forEach((t,i)=>ctx.fillText(t,480,start+i*23));
 ctx.restore();
 ctx.textAlign="left";
}

 ctx.font="18px monospace";

 ctx.textAlign="left";
 ctx.font="15px monospace";
 ctx.fillStyle="#eee3ff";

 let y=190;
 const entries=journalEntries.slice(-11);
 for(const entry of entries){
  ctx.fillText("✦ "+entry,145,y);

}

// PHYSICS

function movePlayer(platforms){
 const speed=4.2;
 player.vx=0;
 if(keys.left){player.vx=-speed;player.facing=-1}
 if(keys.right){player.vx=speed;player.facing=1}

 if(keys.jump&&!player.jumpHeld){
  player.jumpHeld=true;
  player.jumpBuffer=9;
 }
 if(!keys.jump)player.jumpHeld=false;

 if(player.jumpBuffer>0)player.jumpBuffer--;

 if(player.jumpBuffer>0&&player.grounded){
  player.vy=-12.5;
  player.grounded=false;
  player.jumpBuffer=0;
 }

 player.x+=player.vx;
 const previousBottom=player.y+player.h;
 player.vy=Math.min(player.vy+.58,13);
 player.y+=player.vy;

function collectSouls(list,done){
 for(let i=0;i<list.length;i++){
  if(done.includes(i))continue;
  const [x,y]=list[i];
  if(overlap(player,{x:x-10,y:y-12,w:20,h:24})){
   done.push(i);
   score++;
   randomMessage();
   addEntry("Collected a lost soul.");
  }
 }
}
